[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roune-agent-memory"
version = "0.1.0"
description = "File coding-agent sessions and git history, keep only what a person approves, and index that."
# Not README.md: PyPI doesn't resolve its relative links or its image, and
# absolute links would make the GitHub README worse on branches and forks.
readme = "docs/pypi.md"
keywords = ["coding-agent", "memory", "mcp", "cursor", "claude-code", "codex", "git", "qdrant"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # No "License ::" classifier: setuptools 77+ refuses one next to the SPDX
    # `license` expression below.
]
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
# The CLI is standard library only. AGENTS.md keeps capture and review free of
# new dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/roune/agent-memory"
Source = "https://github.com/roune/agent-memory"
Issues = "https://github.com/roune/agent-memory/issues"
Documentation = "https://github.com/roune/agent-memory/blob/main/docs/deploy.md"

[project.optional-dependencies]
# The server in Docker: MCP over streamable HTTP, and the default embedder.
server = [
    "mcp==2.3.0",
    "fastembed==0.9.1",
]

[project.scripts]
agent-memory = "agent_memory:main"
# Installed with or without the extra: an extra can't choose console scripts.
# Without the extra it explains how to get it.
agent-memory-server = "agent_memory_server:main"

[tool.setuptools]
# Modules stay in scripts/, so the test command does not change.
package-dir = { "" = "scripts" }
py-modules = [
    "agent_memory",
    "editors",
    "embed",
    "embedder",
    "local_state",
    "memory_migrate",
    "memory_points",
    "memory_rules",
    "memory_store",
    "outbox",
    "server_client",
    "server_setup",
    "store_core",
]
# The server. Its HTTP parts import Starlette from the server extra; the rest
# is standard library, so the plain-python3 suite tests it too.
packages = ["agent_memory_server", "agent_memory_assets"]

[tool.setuptools.package-data]
# The compose file the CLI writes for `agent-memory setup`.
agent_memory_assets = ["compose.yaml"]
