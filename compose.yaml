# Local Qdrant server. The same image is the later container.
# Storage is the server's own directory, mounted from data/qdrant.
# Bind to loopback: this process has no API key.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./data/shared:/agent-memory
