name: release

# On a v* tag: build ghcr.io/roune/agent-memory-server:<version> for amd64 and
# arm64, push it, then pull it on an amd64 and an arm64 runner and check that
# it answers /v1/health, then upload the wheel and sdist to PyPI. Pushing the tag is the release step; see
# docs/deploy.md, "Releasing". The same build and check run on every PR in
# test.yml's release-image job, against a registry on the runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The name compose.yaml and compose.team.yaml pin (scripts/release-check).
  IMAGE: ghcr.io/roune/agent-memory-server

jobs:
  check:
    # The tag, pyproject.toml and both compose files name one version.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        # On its own line: a failing $(...) inside echo's argument wouldn't stop the step.
        run: |
          version=$(python3 scripts/release-check "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          # The source label links the package to this repo, so it shows on
          # the repo page and the workflow's token can push later versions.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.title=agent-memory-server
            org.opencontainers.image.description=The agent-memory server: the write API and read-only MCP next to Qdrant.

  verify:
    # The published image, pulled as a user would, answers /v1/health on both
    # architectures. The package is private until it is made public once
    # (docs/deploy.md), so this logs in to pull it.
    needs: [check, publish]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and check
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE:$VERSION"
          EXPECT_VERSION="$VERSION" scripts/image-health "$IMAGE:$VERSION" "$PLATFORM"

  build:
    # The wheel and the sdist, built once. The pypi job uploads exactly these
    # files, so the job that holds the PyPI token never runs a build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    # After verify, so a release whose image failed never reaches PyPI. An
    # upload can't be taken back: a version can be yanked, never uploaded twice.
    # Trusted publishing: no token is stored. The pending publisher on PyPI
    # names this workflow and the pypi environment (docs/deploy.md, "Releasing").
    needs: [check, build, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # After pypi, so a release page never points at a version PyPI doesn't have.
    # The only job that can write to the repository.
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install.sh with this release's version filled in
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          mkdir release
          sed "s/@VERSION@/$VERSION/" scripts/install.sh > release/install.sh
          grep -qx "VERSION='$VERSION'" release/install.sh
          sh -n release/install.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A version with a letter (0.3.0rc1, 0.3.0a1) is a prerelease, so
          # releases/latest never points at it.
          flag=""
          if printf '%s' "${TAG#v}" | grep -q '[A-Za-z]'; then flag="--prerelease"; fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $flag \
            release/install.sh compose.yaml compose.team.yaml

  homebrew:
    # After pypi: the formula's url is the sdist PyPI serves. It opens a PR on
    # roune/homebrew-tap that sets url and sha256; the tap's tests build it,
    # and publish.yml there pulls the bottles in. HOMEBREW_TAP_TOKEN is a
    # fine-grained token that can write only to the tap. GITHUB_TOKEN can't
    # reach another repo, and a PR it opened wouldn't run the tap's tests.
    # Without the secret the job does nothing (docs/deploy.md, "Releasing").
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Is HOMEBREW_TAP_TOKEN set
        # A job-level `if:` can't read secrets, so this step tells the others.
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so no tap PR was opened. docs/deploy.md, Releasing, has the manual steps."
          elif printf '%s' "$VERSION" | grep -q '[A-Za-z]'; then
            # A prerelease (0.3.0rc1) stays off the tap, which has one formula for everyone.
            echo "::notice::$VERSION is a prerelease, so no tap PR was opened."
          else
            echo "set=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'yes'
        with:
          persist-credentials: false
      - name: Wait for the sdist on PyPI
        id: sdist
        if: steps.token.outputs.set == 'yes'
        # The upload has finished, but PyPI's JSON API can lag behind it.
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          version = os.environ["VERSION"]
          api = f"https://pypi.org/pypi/roune-agent-memory/{version}/json"
          name = f"roune_agent_memory-{version}.tar.gz"
          deadline = time.monotonic() + 600
          while True:
              try:
                  with urllib.request.urlopen(api, timeout=30) as response:
                      files = json.load(response)["urls"]
                  found = [entry for entry in files if entry["packagetype"] == "sdist" and entry["filename"] == name]
                  if found:
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              except urllib.error.URLError as error:
                  print(f"PyPI didn't answer: {error.reason}")
              if time.monotonic() > deadline:
                  sys.exit(f"{name} isn't on PyPI after 10 minutes: {api}")
              time.sleep(20)
          # The hashed files.pythonhosted.org URL, which `brew audit --online` wants.
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"url={found[0]['url']}\nsha256={found[0]['digests']['sha256']}\n")
          print(found[0]["url"])
          PY
      - name: The formula for that sdist
        if: steps.token.outputs.set == 'yes'
        env:
          URL: ${{ steps.sdist.outputs.url }}
          SHA256: ${{ steps.sdist.outputs.sha256 }}
        run: python3 scripts/homebrew-formula --url "$URL" --sha256 "$SHA256" --out "$RUNNER_TEMP/agent-memory.rb"
      - name: Open the tap PR
        if: steps.token.outputs.set == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          tap=roune/homebrew-tap
          branch="agent-memory-$VERSION"
          # git asks gh for the token, so it never sits in a URL or .git/config.
          gh auth setup-git
          git clone --depth 1 "https://github.com/$tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git switch -c "$branch"
          mkdir -p Formula
          cp "$RUNNER_TEMP/agent-memory.rb" Formula/agent-memory.rb
          git add Formula/agent-memory.rb
          if git diff --cached --quiet; then
            echo "::notice::the tap's main already has agent-memory $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "agent-memory $VERSION"
          # A rerun replaces the branch it pushed before.
          git push --force origin "$branch"
          existing=$(gh pr list --repo "$tap" --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "the tap PR exists already: $existing"
            exit 0
          fi
          url=$(gh pr create --repo "$tap" --base main --head "$branch" \
            --title "agent-memory $VERSION" \
            --body "Sets url and sha256 to the sdist of roune-agent-memory $VERSION on PyPI, from roune/agent-memory's release workflow.")
          number="${url##*/}"
          gh pr edit "$url" --body "$(cat <<BODY
          Sets url and sha256 to the sdist of roune-agent-memory $VERSION on PyPI, from roune/agent-memory's release workflow (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          After the tests are green, publish the bottles. \`brew pr-pull\` then pushes this formula and its bottle block to main:

              gh workflow run publish.yml --repo $tap -f pull_request=$number
          BODY
          )"
          echo "tap PR: $url"
