name: release

# On a v* tag: build ghcr.io/roune/agent-memory-server:<version> for amd64 and
# arm64, push it, then pull it on an amd64 and an arm64 runner and check that
# it answers /v1/health, then upload the wheel and sdist to PyPI. Pushing the tag is the release step; see
# docs/deploy.md, "Releasing". The same build and check run on every PR in
# test.yml's release-image job, against a registry on the runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The name compose.yaml and compose.team.yaml pin (scripts/release-check).
  IMAGE: ghcr.io/roune/agent-memory-server

jobs:
  check:
    # The tag, pyproject.toml and both compose files name one version.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        # On its own line: a failing $(...) inside echo's argument wouldn't stop the step.
        run: |
          version=$(python3 scripts/release-check "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          # The source label links the package to this repo, so it shows on
          # the repo page and the workflow's token can push later versions.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.title=agent-memory-server
            org.opencontainers.image.description=The agent-memory server: the write API and read-only MCP next to Qdrant.

  verify:
    # The published image, pulled as a user would, answers /v1/health on both
    # architectures. The package is private until it is made public once
    # (docs/deploy.md), so this logs in to pull it.
    needs: [check, publish]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and check
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE:$VERSION"
          EXPECT_VERSION="$VERSION" scripts/image-health "$IMAGE:$VERSION" "$PLATFORM"

  build:
    # The wheel and the sdist, built once. The pypi job uploads exactly these
    # files, so the job that holds the PyPI token never runs a build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    # After verify, so a release whose image failed never reaches PyPI. An
    # upload can't be taken back: a version can be yanked, never uploaded twice.
    # Trusted publishing: no token is stored. The pending publisher on PyPI
    # names this workflow and the pypi environment (docs/deploy.md, "Releasing").
    needs: [check, build, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # After pypi, so a release page never points at a version PyPI doesn't have.
    # The only job that can write to the repository.
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install.sh with this release's version filled in
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          mkdir release
          sed "s/@VERSION@/$VERSION/" scripts/install.sh > release/install.sh
          grep -qx "VERSION='$VERSION'" release/install.sh
          sh -n release/install.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A version with a letter (0.3.0rc1, 0.3.0a1) is a prerelease, so
          # releases/latest never points at it.
          flag=""
          if printf '%s' "${TAG#v}" | grep -q '[A-Za-z]'; then flag="--prerelease"; fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $flag \
            release/install.sh compose.yaml compose.team.yaml
