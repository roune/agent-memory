name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    # The repo convention: the suite passes with a plain python3 and no packages.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the throwaway repos the tests create
        run: |
          git config --global user.name "agent-memory CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  package:
    # The lock matches pyproject.toml, the wheel builds, and both commands start.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv build --out-dir dist
      - name: PyPI would accept the metadata and the long description
        run: uvx twine check --strict dist/*
      - name: shellcheck on the install script
        run: shellcheck -s sh scripts/install.sh
      - name: The wheel and the sdist carry the packaged compose.yaml
        run: |
          unzip -Z1 dist/*.whl | grep -qx 'agent_memory_assets/compose.yaml'
          tar tzf dist/*.tar.gz | grep -q 'scripts/agent_memory_assets/compose.yaml'
      - name: Install the wheel without the server extra
        run: |
          uv venv --python 3.12 /tmp/venv
          uv pip install --python /tmp/venv/bin/python dist/*.whl
          # importlib.resources reads the same bytes from the installed wheel.
          cd /tmp && /tmp/venv/bin/python -c "
          import agent_memory_assets, sys
          sys.exit(0 if agent_memory_assets.compose_bytes() == open('$GITHUB_WORKSPACE/compose.yaml', 'rb').read() else 1)"
          cd "$GITHUB_WORKSPACE"
          /tmp/venv/bin/agent-memory --help
          set +e
          /tmp/venv/bin/agent-memory-server 2> /tmp/server.err
          code=$?
          set -e
          cat /tmp/server.err
          test "$code" -eq 2
          grep -q "needs the server extra" /tmp/server.err
      - name: A fresh uv tool install from this commit on GitHub, as docs/deploy.md says
        # The documented command, pinned to this commit. A temporary HOME, and
        # uv's tool folders and the XDG data folder inside it.
        env:
          HOME: ${{ runner.temp }}/tool-home
          XDG_DATA_HOME: ${{ runner.temp }}/tool-home/.local/share
          UV_TOOL_DIR: ${{ runner.temp }}/tool-home/.local/share/uv/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-home/.local/bin
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$HOME/.claude"
          uv tool install "git+https://github.com/$REPO@$SHA"
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          test "$(command -v agent-memory)" = "$UV_TOOL_BIN_DIR/agent-memory"
          agent-memory --help
          set +e
          agent-memory-server 2> "$RUNNER_TEMP/server.err"
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "needs the server extra" "$RUNNER_TEMP/server.err"
          # install points the hooks at the installed command.
          agent-memory install --yes
          python3 -c "
          import json, os, sys
          hooks = json.load(open(os.path.expanduser('~/.claude/settings.json')))['hooks']
          command = hooks['Stop'][0]['hooks'][0]['command']
          expected = os.environ['UV_TOOL_BIN_DIR'] + '/agent-memory capture --tool claude-code --event stop'
          assert command == expected, (command, expected)
          print('hook:', command)
          "
          # A hook files its bundle in the XDG data folder, which is private.
          mkdir -p "$RUNNER_TEMP/proj" && git init -q "$RUNNER_TEMP/proj" && echo '{}' > "$RUNNER_TEMP/proj/t.jsonl"
          printf '{"session_id": "ci-1", "cwd": "%s", "transcript_path": "%s"}' "$RUNNER_TEMP/proj" "$RUNNER_TEMP/proj/t.jsonl" \
            | agent-memory capture --tool claude-code --event stop
          test -f "$XDG_DATA_HOME/agent-memory/inbox/claude-code/ci-1/bundle.json"
          test "$(stat -c %a "$XDG_DATA_HOME/agent-memory")" = 700
      - name: scripts/install, an editable tool install of this checkout
        env:
          HOME: ${{ runner.temp }}/editable-home
          XDG_DATA_HOME: ${{ runner.temp }}/editable-home/.local/share
          UV_TOOL_DIR: ${{ runner.temp }}/editable-home/.local/share/uv/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/editable-home/.local/bin
        run: |
          mkdir -p "$UV_TOOL_BIN_DIR"
          # What the old scripts/install left: a link to this clone's bin/agent-memory.
          ln -s "$GITHUB_WORKSPACE/bin/agent-memory" "$UV_TOOL_BIN_DIR/agent-memory"
          ./scripts/install | tee "$RUNNER_TEMP/install.out"
          grep -q "Removed the old link" "$RUNNER_TEMP/install.out"
          "$UV_TOOL_BIN_DIR/agent-memory" --help > /dev/null
          "$UV_TOOL_DIR/roune-agent-memory/bin/python" -c "import agent_memory; print(agent_memory.__file__)" \
            | grep -qx "$GITHUB_WORKSPACE/scripts/agent_memory.py"

  homebrew:
    # The formula in packaging/homebrew, installed from this commit's sdist the
    # way the tap installs it from PyPI's. release.yml's homebrew job renders
    # the same template with PyPI's URL and opens the tap PR, so a formula that
    # fails here would fail there. The URL is file://, so the audit runs
    # without --online; the tap's brew test-bot builds from PyPI's URL on the bump PR.
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: The sdist, and the formula for it
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/dist"
          version=$(python3 scripts/release-check --version)
          # Homebrew reads the version from this file name, so the path keeps it.
          sdist="$RUNNER_TEMP/dist/roune_agent_memory-$version.tar.gz"
          test -f "$sdist"
          sha=$(shasum -a 256 "$sdist" | cut -d' ' -f1)
          python3 scripts/homebrew-formula --local --url "file://$sdist" --sha256 "$sha" --out "$RUNNER_TEMP/agent-memory.rb"
          cat "$RUNNER_TEMP/agent-memory.rb"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: A local tap with that formula
        run: |
          brew tap-new --no-git roune/ci
          tap=$(brew --repository roune/ci)
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/agent-memory.rb" "$tap/Formula/agent-memory.rb"
          echo "BREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
      - name: Install from source by the full name, with no trust step, as the README's first line
        run: brew install --build-from-source --verbose roune/ci/agent-memory
      - name: brew test
        run: brew test --verbose roune/ci/agent-memory
      - name: brew audit
        run: brew audit --strict --new roune/ci/agent-memory
      - name: Again by the short name, after brew trust, as the README's second path
        run: |
          brew uninstall agent-memory
          brew trust --formula roune/ci/agent-memory
          brew install --build-from-source agent-memory
          test "$(brew list --versions agent-memory)" = "agent-memory $VERSION"
      - name: agent-memory install points the hooks at the prefix's bin, not the Cellar
        env:
          HOME: ${{ runner.temp }}/brew-home
          XDG_DATA_HOME: ${{ runner.temp }}/brew-home/.local/share
          XDG_CONFIG_HOME: ${{ runner.temp }}/brew-home/.config
        run: |
          mkdir -p "$HOME/.claude"
          cli="$BREW_PREFIX/bin/agent-memory"
          test "$(command -v agent-memory)" = "$cli"
          # The file the link leads to sits in the versioned Cellar folder, which an upgrade replaces.
          realpath "$cli" | tee /dev/stderr | grep -q "/Cellar/agent-memory/$VERSION/"
          test "$("$cli" --version)" = "agent-memory $VERSION"
          "$cli" install --yes
          python3 -c "
          import json, os
          hooks = json.load(open(os.path.expanduser('~/.claude/settings.json')))['hooks']
          command = hooks['Stop'][0]['hooks'][0]['command']
          expected = os.environ['BREW_PREFIX'] + '/bin/agent-memory capture --tool claude-code --event stop'
          assert command == expected, (command, expected)
          assert 'Cellar' not in command, command
          print('hook:', command)
          "

  server:
    # The whole suite with the server extra, so nothing is skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Git identity for the throwaway repos the tests create
        run: |
          git config --global user.name "agent-memory CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: ./scripts/test-server

  image:
    # The image builds and answers /v1/health with auth on and off. With auth
    # on, /v1/whoami and /mcp need a token, and one made with `token create`
    # works for both. The CLI on the runner connects to it and migrates a store.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-memory-server:ci .
      - name: Auth on (the default), with Qdrant absent
        run: |
          docker run -d --name server agent-memory-server:ci
          ready=""
          for i in $(seq 1 90); do
            if docker exec server python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=4).read().decode())"; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then docker logs server; exit 1; fi
          docker exec server python -c "
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:8765/v1/whoami', timeout=4)
          except urllib.error.HTTPError as error:
              raise SystemExit(0 if error.code == 401 else f'expected 401, got {error.code}')
          raise SystemExit('whoami answered without a token')
          "
          secret=$(docker exec server agent-memory-server token create --person ci --org CI --team CI --scopes read | sed -n 2p)
          docker exec -e TOKEN="$secret" server python -c "
          import json, os, urllib.request
          request = urllib.request.Request('http://127.0.0.1:8765/v1/whoami', headers={'Authorization': 'Bearer ' + os.environ['TOKEN']})
          who = json.load(urllib.request.urlopen(request, timeout=4))
          assert who['person'] == 'ci' and who['scopes'] == ['read'], who
          print('whoami:', who['person'], who['scopes'])
          "
          docker exec -e TOKEN="$secret" server python -c "
          import json, os, urllib.error, urllib.request
          def mcp(message, token=None, session=None):
              headers = {'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream', 'MCP-Protocol-Version': '2025-06-18'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              if session:
                  headers['Mcp-Session-Id'] = session
              request = urllib.request.Request('http://127.0.0.1:8765/mcp', data=json.dumps(message).encode(), headers=headers)
              return urllib.request.urlopen(request, timeout=10)
          hello = {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'ci', 'version': '1'}}}
          try:
              mcp(hello)
              raise SystemExit('/mcp answered without a token')
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          token = os.environ['TOKEN']
          session = mcp(hello, token).headers['mcp-session-id']
          mcp({'jsonrpc': '2.0', 'method': 'notifications/initialized'}, token, session)
          tools = json.load(mcp({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}, token, session))['result']['tools']
          names = sorted(tool['name'] for tool in tools)
          assert names == ['get', 'list', 'search'], names
          print('mcp tools:', names)
          "
      - name: Auth off, with Qdrant absent
        run: |
          docker run -d --name local -e AGENT_MEMORY_AUTH=off agent-memory-server:ci
          for i in $(seq 1 90); do
            if docker exec local python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=4).read().decode())"; then
              exit 0
            fi
            sleep 1
          done
          docker logs local
          exit 1
      - name: The CLI connects and migrates a store, auth on
        env:
          HOME: ${{ runner.temp }}/home
          AGENT_MEMORY_DIR: ${{ runner.temp }}/state
        run: |
          mkdir -p "$HOME"
          docker run -d --name published -p 127.0.0.1:8765:8765 agent-memory-server:ci
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8765/v1/health > /dev/null; then break; fi
            sleep 1
          done
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import memory_store
          for number in range(3):
              memory_store.save_approved({'id': f'ci-learning-s{number}', 'kind': 'learning', 'domain': 'code', 'text': f'note {number}',
                  'repo': 'github.com/example/ci', 'tool': 'git', 'session_id': f's{number}', 'org': 'CI', 'team': 'CI', 'person': 'ci',
                  'occurred_at': '2026-11-20T11:00:00+01:00', 'commits': []})
          "
          python3 scripts/agent_memory.py migrate --dry-run | tee dry.txt
          grep -q "memories: 3" dry.txt
          if python3 scripts/agent_memory.py connect --url http://127.0.0.1:8765; then
            echo "connect without a token should fail"; exit 1
          fi
          test ! -e "$HOME/.config/agent-memory/server"
          docker exec published agent-memory-server token create --person ci --org CI --team CI --scopes read,write,admin | sed -n 2p \
            | python3 scripts/agent_memory.py connect --url http://127.0.0.1:8765 --token-stdin
          test "$(stat -c %a "$HOME/.config/agent-memory/server")" = 600
          python3 scripts/agent_memory.py migrate | tee first.txt
          grep -q "verified: all 3 memories" first.txt
          python3 scripts/agent_memory.py migrate | tee second.txt
          grep -q "sent: 0 written, 3 already there or newer" second.txt
          python3 scripts/agent_memory.py list --repo github.com/example/ci | python3 -c "
          import json, sys
          hits = json.load(sys.stdin)
          assert len(hits) == 3, hits
          assert {hit['occurred_at'] for hit in hits} == {'2026-11-20T10:00:00+00:00'}, 'the import converts occurred_at to UTC'
          print('list through the server:', len(hits))
          "

  release-image:
    # The release workflow's build (release.yml), without publishing: both
    # platforms pushed to a registry on this runner instead of GHCR, then each
    # one pulled and checked with scripts/image-health, the check release.yml
    # runs on the published image. A tag-only workflow can't run in a PR, so
    # this is the same build and check, one step short of GHCR. It also runs
    # the no-clone setup and compose.team.yaml against that image, and last of
    # all `agent-memory setup` from the built wheel. Those steps share port
    # 8765, so each earlier one ends with `down`, and the last one checks that
    # nothing holds the port before it starts.
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/agent-memory-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The version the next tag must carry
        id: version
        run: |
          version=$(python3 scripts/release-check --version)
          python3 scripts/release-check "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Each platform answers /v1/health
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for platform in linux/arm64 linux/amd64; do
            docker pull --platform "$platform" "$IMAGE:$VERSION"
            EXPECT_VERSION="$VERSION" scripts/image-health "$IMAGE:$VERSION" "$platform"
          done
      - name: Without a clone, only compose.yaml, pull, then up
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/no-clone"
          mkdir -p "$dir/data/server" "$dir/data/qdrant"
          cp compose.yaml "$dir/"
          cd "$dir"
          # As docs/deploy.md says: the server runs as the owner of data/server.
          printf 'AGENT_MEMORY_UID=%s\nAGENT_MEMORY_GID=%s\n' "$(id -u)" "$(id -g)" > .env
          export AGENT_MEMORY_IMAGE="$IMAGE:$VERSION"
          docker compose -p no-clone pull
          docker compose -p no-clone up -d
          # Up once Qdrant is ready too.
          ready=""
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8765/v1/health > health.json \
              && python3 -c "import json, sys; h = json.load(open('health.json')); sys.exit(0 if h['qdrant']['ready'] else 1)"; then
              ready=yes; break
            fi
            sleep 1
          done
          cat health.json
          if [ -z "$ready" ]; then docker compose -p no-clone logs; exit 1; fi
          python3 -c "import json; h = json.load(open('health.json')); assert h['auth'] == 'off', h"
          docker compose -p no-clone down
      - name: compose.team.yaml, auth on and only the team host
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/team"
          mkdir -p "$dir/data/server" "$dir/data/qdrant"
          cp compose.team.yaml "$dir/"
          cd "$dir"
          export AGENT_MEMORY_IMAGE="$IMAGE:$VERSION"
          if docker compose -f compose.team.yaml config > /dev/null 2> missing.err; then
            echo "compose.team.yaml started without AGENT_MEMORY_ALLOWED_HOSTS"; exit 1
          fi
          grep -q AGENT_MEMORY_ALLOWED_HOSTS missing.err
          printf 'AGENT_MEMORY_ALLOWED_HOSTS=memory.example.test\nAGENT_MEMORY_UID=%s\nAGENT_MEMORY_GID=%s\n' "$(id -u)" "$(id -g)" > .env
          docker compose -p team -f compose.team.yaml up -d
          host="Host: memory.example.test"
          ready=""
          for i in $(seq 1 120); do
            if curl -sf -H "$host" http://127.0.0.1:8765/v1/health > health.json \
              && python3 -c "import json, sys; h = json.load(open('health.json')); sys.exit(0 if h['qdrant']['ready'] else 1)"; then
              ready=yes; break
            fi
            sleep 1
          done
          cat health.json
          if [ -z "$ready" ]; then docker compose -p team -f compose.team.yaml logs; exit 1; fi
          python3 -c "import json; h = json.load(open('health.json')); assert h['auth'] == 'on', h"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$host" http://127.0.0.1:8765/v1/whoami)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.example.test' http://127.0.0.1:8765/v1/health)" = 421
          secret=$(docker compose -p team -f compose.team.yaml exec -T server agent-memory-server token create --person ci --org CI --team CI --scopes read | sed -n 2p)
          curl -sf -H "$host" -H "Authorization: Bearer $secret" http://127.0.0.1:8765/v1/whoami
          # The image's own health check sends Host: 127.0.0.1:8765, which the file allows.
          id=$(docker compose -p team -f compose.team.yaml ps -q server)
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            if [ "$state" = healthy ]; then break; fi
            sleep 5
          done
          echo "health check: $state"
          test "$state" = healthy
          docker compose -p team -f compose.team.yaml down
      - uses: astral-sh/setup-uv@v6
      - name: agent-memory setup, twice, from the built wheel and this image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The earlier steps ended with `down`. Setup would refuse a busy port, so fail here with a clear line.
          test -z "$(docker ps -q --filter publish=8765)" || { docker ps; echo "port 8765 is still held"; exit 1; }

          # A temporary HOME, so setup writes no real config. Docker keeps the real one.
          export DOCKER_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/wheel/*.whl
          export HOME="$RUNNER_TEMP/setup-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME"
          export AGENT_MEMORY_IMAGE="$IMAGE:$VERSION"
          cli="$RUNNER_TEMP/venv/bin/agent-memory"
          folder="$XDG_DATA_HOME/agent-memory/server"
          test "$("$cli" setup --print-dir)" = "$folder"

          "$cli" setup --no-input 2>&1 | tee first.log
          # The image was built from this commit, so its version is the CLI's, and setup has no warning to print.
          if grep -q "this CLI is" first.log; then exit 1; fi
          curl -sf http://127.0.0.1:8765/v1/health | python3 -c "import json, sys; h = json.load(sys.stdin); assert h['status'] == 'ok' and h['version'] == '$VERSION', h"
          grep -qx "url = http://127.0.0.1:8765" "$HOME/.config/agent-memory/server"
          test -f "$folder/data/server/memories.sqlite"

          # One memory through the API, so the second setup has data to keep.
          curl -sf -X POST -H 'Content-Type: application/json' http://127.0.0.1:8765/v1/memories \
            -d '{"kind": "learning", "domain": "code", "text": "kept across setup", "repo": "github.com/example/ci", "tool": "git", "session_id": "ci", "org": "CI", "team": "CI", "person": "ci", "occurred_at": "2026-11-20T10:00:00+00:00"}' > written.json
          id=$(python3 -c "import json; print(json.load(open('written.json'))['id'])")
          curl -sf "http://127.0.0.1:8765/v1/memories/$id" | grep -q "kept across setup"

          # The upgrade step, run again: the data stays, and the server comes back.
          "$cli" setup --no-input 2>&1 | tee second.log
          if grep -q "this CLI is" second.log; then exit 1; fi
          test -f "$folder/data/server/memories.sqlite"
          curl -sf "http://127.0.0.1:8765/v1/memories/$id" | grep -q "kept across setup"
          curl -sf http://127.0.0.1:8765/v1/health | python3 -c "import json, sys; h = json.load(sys.stdin); assert h['status'] == 'ok', h"
          docker compose -p agent-memory-server -f "$folder/compose.yaml" --project-directory "$folder" down
